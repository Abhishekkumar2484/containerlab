name: ContainerLab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        working-directory: app
        run: go mod download

      - name: Build Go API
        working-directory: app
        run: go build ./...

      - name: Build Docker image
        run: docker build -t containerlab-api:ci .
