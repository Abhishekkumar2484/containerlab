services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: containerlab-api:validation
    container_name: containerlab-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: containerlab-db
    environment:
      POSTGRES_USER: containerlab
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: containerlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U containerlab -d containerlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
