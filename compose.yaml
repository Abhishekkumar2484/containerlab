services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: containerlab-api:v4
    container_name: containerlab-api
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: containerlab-db
    environment:
      POSTGRES_USER: containerlab
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: containerlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
